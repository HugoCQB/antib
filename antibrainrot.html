<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>ANTI BRAINROTTING</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 10px 14px;
    }
    .card, .backup-actions, #actionBtn, #buySection, #bonusInfo, #rewardChoiceSection {
      width: 100%;
      max-width: 360px;
    }
    .backup-actions {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }
    .btn-secondary {
      flex: 1;
      background: #000;
      border: 1px solid #fff;
      color: #fff;
      font-size: 0.68rem;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    .btn-secondary:hover { background: #fff; color: #000; }
    
    .unified-stats-card, .config-card {
      background: #000;
      border: 1px solid #fff;
      border-radius: 8px;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .unified-stats-card { padding: 8px 10px; }
    .config-card { padding: 8px 12px; }

    .stats-header {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 6px;
    }
    .stat-box { display: flex; flex-direction: column; align-items: center; }
    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1px;
      font-weight: 600;
    }
    .stat-val {
      font-size: 1.05rem;
      font-weight: 700;
      font-family: "SF Mono", Monaco, Consolas, monospace;
    }
    .stat-sub { font-size: 0.68rem; margin-top: 1px; }

    /* Grille et paliers */
    .tiers-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
      width: 100%;
    }
    .tier-box {
      width: 100%;
      height: 58px;
      background: #000;
      border: 1px solid #666;
      border-radius: 6px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #666;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.1s;
    }
    .tier-box:active { transform: scale(0.97); }

    .tier-box span {
      display: block;
      width: 100%;
      text-align: center;
      white-space: nowrap;
      line-height: 1.15;
      color: inherit;
    }
    .tier-label { font-size: 0.62rem; font-weight: 700; }
    .tier-val {
      font-size: 0.76rem;
      font-weight: 700;
      font-family: "SF Mono", Monaco, Consolas, monospace;
    }
    .tier-rec { font-size: 0.58rem; }
    .tier-mult {
      font-size: 0.55rem;
      font-family: "SF Mono", Monaco, Consolas, monospace;
    }

    .tier-box.locked {
      border-color: #666;
      color: #666;
    }
    .tier-box.completed-today {
      border-color: #fff;
      color: #fff;
    }
    .tier-box.selected-target {
      outline: 2px solid #fff;
      outline-offset: -2px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
    }

    /* Actions secondaires sous stats */
    #bonusInfo, #btnBuyStreak {
      width: 100%;
      height: 34px;
      margin: 0 0 6px 0;
      padding: 0 10px;
      border: 1px dashed #fff;
      border-radius: 8px;
      background: #000;
      color: #fff;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    #bonusInfo { display: none; cursor: default; }
    #buySection { width: 100%; margin: 0; display: none; }
    #btnBuyStreak {
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    #btnBuyStreak:hover:not(:disabled) { background: #fff; color: #000; }
    #btnBuyStreak:disabled { border-color: #444; color: #555; cursor: not-allowed; }

    /* Configuration */
    .config-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .row-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .inputs-wrapper { 
      display: flex; 
      align-items: center; 
      gap: 3px; 
    }
    .unit-tag { 
      font-size: 0.68rem; 
      margin-right: 2px; 
      font-weight: 600; 
      color: #aaa;
    }

    input[type="number"], select {
      background: #000;
      border: 1px solid #fff;
      color: #fff;
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
    }
    input[type="number"] {
      padding: 3px 1px;
      width: 36px;
      text-align: center;
      font-weight: bold;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    select { padding: 4px 6px; max-width: 185px; font-weight: 600; }
    input:disabled, select:disabled { border-color: #555; color: #555; -webkit-text-fill-color: #555; }

    .checkbox-label {
      display: flex;
      align-items: center;
      cursor: pointer;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .checkbox-label input { width: 15px; height: 15px; accent-color: #fff; cursor: pointer; }

    /* Bouton principal & Choix de récompense */
    #actionBtn {
      background: #fff;
      color: #000;
      border: 1px solid #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      min-height: 44px;
      line-height: 1.3;
      white-space: pre-line;
      margin-bottom: 6px;
      touch-action: manipulation;
    }
    #actionBtn:active { transform: scale(0.98); }
    #actionBtn.stop { background: #000; color: #fff; }
    #actionBtn.stop:active { background: #fff; color: #000; }
    #actionBtn.presence { background: #000; color: #fff; font-size: 1.4rem; }

    #rewardChoiceSection {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
    }
    .btn-reward {
      background: #000;
      border: 1px solid #fff;
      color: #fff;
      padding: 10px 8px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-transform: uppercase;
      line-height: 1.3;
      transition: background 0.2s, color 0.2s;
    }
    .btn-reward:hover {
      background: #fff;
      color: #000;
    }
    .btn-reward:active {
      transform: scale(0.98);
    }

    #stopwatch {
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-size: 1.15rem;
      letter-spacing: 2px;
      min-height: 22px;
      font-weight: 700;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="backup-actions">
    <button class="btn-secondary" id="btnExport">Exporter</button>
    <button class="btn-secondary" id="btnImport">Importer</button>
    <input type="file" id="importFile" class="hidden" accept=".json">
  </div>

  <div class="unified-stats-card card">
    <div class="stats-header">
      <div class="stat-box">
        <span class="stat-label">Série Quotidienne</span>
        <span class="stat-val" id="statDayStreak">0 j</span>
        <span class="stat-sub" id="statDayStreakRecord">Record : 0 j</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Solde Temps</span>
        <span class="stat-val" id="statBank">0s</span>
        <span class="stat-sub">Réserve de streak</span>
      </div>
    </div>
    <div class="tiers-grid" id="tiersContainer"></div>
  </div>

  <div id="bonusInfo"></div>

  <div id="buySection">
    <button id="btnBuyStreak">Acheter le streak</button>
  </div>

  <div class="config-card card">
    <div class="config-row" id="rowMin">
      <span class="row-label">Min</span>
      <div class="inputs-wrapper">
        <input type="number" id="minH" value="0" min="0" max="99">
        <span class="unit-tag">h</span>
        <input type="number" id="minM" value="0" min="0" max="59">
        <span class="unit-tag">m</span>
        <input type="number" id="minS" value="5" min="0" max="59">
        <span class="unit-tag">s</span>
      </div>
    </div>
    <div class="config-row">
      <span class="row-label">Max</span>
      <div class="inputs-wrapper">
        <input type="number" id="maxH" value="0" min="0" max="99">
        <span class="unit-tag">h</span>
        <input type="number" id="maxM" value="3" min="0" max="59">
        <span class="unit-tag">m</span>
        <input type="number" id="maxS" value="3" min="0" max="59">
        <span class="unit-tag">s</span>
      </div>
    </div>
    <div class="config-row">
      <span class="row-label">Tirage</span>
      <select id="probDist">
        <option value="fixed">Durée fixe (Max)</option>
        <option value="linear" selected>Linéaire (vers max)</option>
        <option value="uniform">Uniforme (classique)</option>
      </select>
    </div>
    <div class="config-row" id="rowSurprise">
      <span class="row-label">Contrôles</span>
      <select id="surpriseFreq">
        <option value="0">Aucun (0 %)</option>
        <option value="0.0055">Rare (~1 / 3 min)</option>
        <option value="0.011" selected>Modéré (~1 / 90 s)</option>
        <option value="0.020">Fréquent (~1 / 50 s)</option>
        <option value="0.0333">Intense (~1 / 30 s)</option>
      </select>
    </div>
    <div class="config-row">
      <span class="row-label">Chrono</span>
      <label class="checkbox-label">
        <input type="checkbox" id="showStopwatch" checked>
        <span>Afficher le temps</span>
      </label>
    </div>
  </div>

  <div id="rewardChoiceSection">
    <button class="btn-reward" id="btnChooseStreak">VALIDER LA SÉRIE</button>
    <button class="btn-reward" id="btnChooseBank">SOLDE EN BANQUE (TAUX ÷ 2)</button>
  </div>

  <button id="actionBtn">COMMENCER</button>
  <div id="stopwatch">00:00</div>

  <script>
    const $ = id => document.getElementById(id);

    const DURATION_TIERS = [
      { id: "1m", label: "≥ 1m", minSec: 60, rate: 0.10 },
      { id: "5m", label: "≥ 5m", minSec: 300, rate: 0.15 },
      { id: "10m", label: "≥ 10m", minSec: 600, rate: 0.20 },
      { id: "15m", label: "≥ 15m", minSec: 900, rate: 0.25 },
      { id: "30m", label: "≥ 30m", minSec: 1800, rate: 0.30 },
      { id: "45m", label: "≥ 45m", minSec: 2700, rate: 0.35 },
      { id: "1h", label: "≥ 1h", minSec: 3600, rate: 0.40 },
      { id: "1h30", label: "≥ 1h30", minSec: 5400, rate: 0.45 },
      { id: "2h", label: "≥ 2h", minSec: 7200, rate: 0.50 },
      { id: "2h30", label: "≥ 2h30", minSec: 9000, rate: 0.55 },
      { id: "3h", label: "≥ 3h", minSec: 10800, rate: 0.60 },
      { id: "3h30", label: "≥ 3h30", minSec: 12600, rate: 0.65 },
      { id: "4h", label: "≥ 4h", minSec: 14400, rate: 0.70 },
      { id: "4h30", label: "≥ 4h30", minSec: 16200, rate: 0.75 },
      { id: "5h", label: "≥ 5h", minSec: 18000, rate: 0.80 },
      { id: "5h30", label: "≥ 5h30", minSec: 19800, rate: 0.85 },
      { id: "6h", label: "≥ 6h", minSec: 21600, rate: 0.90 }
    ];

    let selectedTierId = null, running = false, presenceMode = null;
    let targetSeconds = 0, configuredMaxSeconds = 0, elapsedSeconds = 0;
    let pauseOffsetMs = 0, pauseStartMs = 0, startTime = 0;
    let masterInterval = null, presenceTimer = null;
    let surpriseProbPerSec = 0, lastSurpriseEndSecond = -999;
    let pendingVictory = null;

    const stopIfRunning = () => { if (running) declarerEchec("APPLICATION QUITTÉE"); };
    document.addEventListener("visibilitychange", () => { if (document.hidden) stopIfRunning(); });
    window.addEventListener("pagehide", stopIfRunning);
    window.addEventListener("blur", stopIfRunning);

    const recupererDateJour = () => new Date().toISOString().slice(0, 10);
    const calculerEcartJours = (d1, d2) => (!d1 || !d2) ? 999 : Math.round((new Date(d2) - new Date(d1)) / 864e5);
    const lireSecondesConfig = (hId, mId, sId) => 
      (parseInt($(hId).value, 10) || 0) * 3600 +
      (parseInt($(mId).value, 10) || 0) * 60 +
      (parseInt($(sId).value, 10) || 0);

    function chargerDonneesStats() {
      const defaut = { lastActiveDate: null, dayStreak: 0, dayStreakRecord: 0, bankSeconds: 0, tiers: {} };
      DURATION_TIERS.forEach(t => defaut.tiers[t.id] = { streak: 0, record: 0, lastDate: null });

      try {
        const raw = localStorage.getItem('meditation_presence_stats');
        if (!raw) return defaut;
        const data = Object.assign(defaut, JSON.parse(raw));
        const today = recupererDateJour();

        if (calculerEcartJours(data.lastActiveDate, today) > 1) data.dayStreak = 0;
        data.dayStreakRecord = Math.max(data.dayStreak, data.dayStreakRecord || 0);

        DURATION_TIERS.forEach(t => {
          const tier = data.tiers[t.id] = data.tiers[t.id] || { streak: 0, record: 0, lastDate: null };
          if (calculerEcartJours(tier.lastDate, today) > 1) tier.streak = 0;
          tier.record = Math.max(tier.streak, tier.record || 0);
        });
        return data;
      } catch {
        return defaut;
      }
    }

    const enregistrerDonneesStats = data => {
      try { localStorage.setItem('meditation_presence_stats', JSON.stringify(data)); } catch {}
    };

    function actualiserBoutonRecommencer() {
      if (running || pendingVictory) return;
      reinitialiserBouton(`COMMENCER\n${formaterTemps(lireSecondesConfig('maxH', 'maxM', 'maxS'))}`);
    }

    function selectionnerPalier(id) {
      if (running || pendingVictory) return;
      if (selectedTierId === id) {
        selectedTierId = null;
      } else {
        selectedTierId = id;
        const t = DURATION_TIERS.find(tier => tier.id === id);
        if (t) {
          $('maxH').value = Math.floor(t.minSec / 3600);
          $('maxM').value = Math.floor((t.minSec % 3600) / 60);
          $('maxS').value = t.minSec % 60;
          sauvegarderParametres();
        }
      }
      rafraichirAffichageStats();
      actualiserBoutonRecommencer();
    }

    function actualiserPalierSelonMax() {
      const maxSec = lireSecondesConfig('maxH', 'maxM', 'maxS');
      const match = [...DURATION_TIERS].reverse().find(t => maxSec >= t.minSec);
      selectedTierId = match ? match.id : null;

      sauvegarderParametres();
      rafraichirAffichageStats();
      actualiserBoutonRecommencer();
    }

    function rafraichirAffichageStats() {
      const data = chargerDonneesStats();
      const today = recupererDateJour();

      $('statDayStreak').textContent = `${data.dayStreak} j`;
      $('statDayStreakRecord').textContent = `Record : ${data.dayStreakRecord || 0} j`;
      $('statBank').textContent = formaterTempsCourt(data.bankSeconds || 0);

      const fragment = document.createDocumentFragment();
      DURATION_TIERS.forEach(t => {
        const tData = data.tiers[t.id] || { streak: 0, record: 0, lastDate: null };
        const isDoneToday = tData.lastDate === today;
        let cls = isDoneToday ? "completed-today" : "locked";
        if (selectedTierId === t.id) cls += " selected-target";

        const box = document.createElement('div');
        box.className = `tier-box ${cls}`;
        box.onclick = () => selectionnerPalier(t.id);
        box.innerHTML = `
          <span class="tier-label">${t.label}</span>
          <span class="tier-val">${tData.streak}j</span>
          <span class="tier-rec">r:${tData.record}</span>
          <span class="tier-mult">×${t.rate}</span>
        `;
        fragment.appendChild(box);
      });
      $('tiersContainer').replaceChildren(fragment);

      const buySec = $('buySection');
      const bonusInfo = $('bonusInfo');
      const tierObj = selectedTierId ? DURATION_TIERS.find(t => t.id === selectedTierId) : null;
      const isSelectedDoneToday = tierObj && data.tiers[selectedTierId]?.lastDate === today;

      bonusInfo.style.display = (tierObj && !running && !pendingVictory && isSelectedDoneToday) ? 'flex' : 'none';
      if (bonusInfo.style.display === 'flex') {
        bonusInfo.textContent = `Palier ${tierObj.label} déjà validé`;
      }

      if (tierObj && !running && !pendingVictory && !isSelectedDoneToday) {
        const costSec = Math.round(tierObj.minSec * 1.5);
        buySec.style.display = 'block';
        $('btnBuyStreak').textContent = `Acheter streak ${tierObj.label} (${formaterTempsCourt(costSec)})`;
        $('btnBuyStreak').disabled = (data.bankSeconds || 0) < costSec;
      } else {
        buySec.style.display = 'none';
      }
    }

    function acheterStreak() {
      if (!selectedTierId || running || pendingVictory) return;
      const data = chargerDonneesStats();
      const today = recupererDateJour();
      const tierObj = DURATION_TIERS.find(t => t.id === selectedTierId);
      if (!tierObj) return;

      const costSec = Math.round(tierObj.minSec * 1.5);
      if ((data.bankSeconds || 0) < costSec) {
        alert("Solde de temps insuffisant pour acheter ce streak.");
        return;
      }

      data.bankSeconds -= costSec;
      if (data.lastActiveDate !== today) {
        data.dayStreak = (calculerEcartJours(data.lastActiveDate, today) === 1) ? data.dayStreak + 1 : 1;
        data.lastActiveDate = today;
      }
      data.dayStreakRecord = Math.max(data.dayStreak, data.dayStreakRecord || 0);

      const tier = data.tiers[tierObj.id] = data.tiers[tierObj.id] || { streak: 0, record: 0, lastDate: null };
      tier.streak = (calculerEcartJours(tier.lastDate, today) === 1) ? tier.streak + 1 : 1;
      tier.lastDate = today;
      tier.record = Math.max(tier.streak, tier.record || 0);

      enregistrerDonneesStats(data);
      rafraichirAffichageStats();
      alert(`Streak ${tierObj.label} acheté avec succès !`);
    }

    function exporterSauvegarde() {
      const exportData = {
        version: 7,
        dateExport: new Date().toISOString(),
        config: localStorage.getItem('meditation_presence_config'),
        stats: localStorage.getItem('meditation_presence_stats')
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `presence-backup-${recupererDateJour()}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importerSauvegarde(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.stats) localStorage.setItem('meditation_presence_stats', typeof data.stats === 'string' ? data.stats : JSON.stringify(data.stats));
          if (data.config) localStorage.setItem('meditation_presence_config', typeof data.config === 'string' ? data.config : JSON.stringify(data.config));

          chargerParametres();
          gererChangementDistribution();
          toggleChronoDisplay();
          actualiserPalierSelonMax();
          alert("Données importées avec succès.");
        } catch {
          alert("Erreur lors de l'import : fichier corrompu ou invalide.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function traiterRecompenseSession(choix) {
      if (!pendingVictory) return;
      const { maxSecSession, dureeReelle, targetTier } = pendingVictory;
      const stats = chargerDonneesStats();
      const today = recupererDateJour();
      let gainBanque = 0;
      let texteResultat = "";

      if (choix === 'streak') {
        if (stats.lastActiveDate !== today) {
          stats.dayStreak = (calculerEcartJours(stats.lastActiveDate, today) === 1) ? stats.dayStreak + 1 : 1;
          stats.lastActiveDate = today;
        }
        stats.dayStreakRecord = Math.max(stats.dayStreak, stats.dayStreakRecord || 0);

        if (targetTier) {
          const tier = stats.tiers[targetTier.id] = stats.tiers[targetTier.id] || { streak: 0, record: 0, lastDate: null };
          tier.streak = (calculerEcartJours(tier.lastDate, today) === 1) ? tier.streak + 1 : 1;
          tier.lastDate = today;
          tier.record = Math.max(tier.streak, tier.record || 0);
        }
        texteResultat = "STREAK COMPTABILISÉ";
      } else if (choix === 'bank_half') {
        const rateHalf = targetTier ? (targetTier.rate / 2) : 0.125;
        gainBanque = Math.floor(dureeReelle * rateHalf);
        stats.bankSeconds = (stats.bankSeconds || 0) + gainBanque;
        texteResultat = `+${formaterTemps(gainBanque)} (TAUX ÷2)`;
      } else if (choix === 'bank_full') {
        const fullRate = targetTier ? targetTier.rate : 0.25;
        gainBanque = Math.floor(dureeReelle * fullRate);
        stats.bankSeconds = (stats.bankSeconds || 0) + gainBanque;
        texteResultat = `+${formaterTemps(gainBanque)} SOLDÉ`;
      }

      enregistrerDonneesStats(stats);
      rafraichirAffichageStats();

      const tempsTenu = formaterTemps(dureeReelle);
      pendingVictory = null;
      $('rewardChoiceSection').style.display = 'none';
      $('actionBtn').style.display = 'block';
      reinitialiserBouton(`GAGNÉ (${tempsTenu})\n${texteResultat}\nRECOMMENCER`);
    }

    function sauvegarderParametres() {
      try {
        localStorage.setItem('meditation_presence_config', JSON.stringify({
          minH: $('minH').value, minM: $('minM').value, minS: $('minS').value,
          maxH: $('maxH').value, maxM: $('maxM').value, maxS: $('maxS').value,
          surpriseFreq: $('surpriseFreq').value,
          probDist: $('probDist').value,
          showStopwatch: $('showStopwatch').checked
        }));
      } catch {}
    }

    function chargerParametres() {
      try {
        const config = JSON.parse(localStorage.getItem('meditation_presence_config') || '{}');
        ['minH', 'minM', 'minS', 'maxH', 'maxM', 'maxS', 'surpriseFreq', 'probDist'].forEach(k => {
          if (config[k] !== undefined && $(k)) $(k).value = config[k];
        });
        if (config.showStopwatch !== undefined) $('showStopwatch').checked = config.showStopwatch;
      } catch {}
    }

    function gererChangementDistribution() {
      const isFixed = $('probDist').value === 'fixed';
      $('minH').disabled = $('minM').disabled = $('minS').disabled = isFixed;
      $('rowMin').style.display = isFixed ? "none" : "flex";
      $('surpriseFreq').disabled = !isFixed;
      $('rowSurprise').style.display = isFixed ? "flex" : "none";
    }

    function toggleChronoDisplay() {
      $('stopwatch').classList.toggle('hidden', !$('showStopwatch').checked);
    }

    function formaterTemps(totalSec) {
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      const parts = [];
      if (h > 0) parts.push(`${h}h`);
      if (m > 0) parts.push(`${m}m`);
      if (s > 0 || parts.length === 0) parts.push(`${s}s`);
      return parts.join(' ');
    }

    function formaterTempsCourt(totalSec) {
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      const parts = [];
      if (h > 0) parts.push(`${h}h`);
      if (m > 0) parts.push(`${m}m`);
      if (s > 0 || parts.length === 0) parts.push(`${s}s`);
      return parts.join('');
    }

    function formaterChrono(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) {
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function calculerTempsCible(minSec, maxSec, mode) {
      if (mode === 'fixed' || minSec >= maxSec) return maxSec;
      const u = Math.random();
      const mult = mode === 'linear' ? Math.sqrt(u) : u;
      return minSec + Math.floor(mult * (maxSec - minSec + 1));
    }

    function toggleFormInputs(disabled) {
      ['maxH', 'maxM', 'maxS', 'showStopwatch', 'probDist'].forEach(id => $(id).disabled = disabled);
      if (disabled) {
        $('minH').disabled = $('minM').disabled = $('minS').disabled = $('surpriseFreq').disabled = true;
        $('buySection').style.display = $('bonusInfo').style.display = 'none';
      } else {
        gererChangementDistribution();
        rafraichirAffichageStats();
      }
    }

    function handleClick() {
      if (presenceMode === 'mid') {
        clearTimeout(presenceTimer);
        presenceMode = null;
        pauseOffsetMs += (Date.now() - pauseStartMs);
        lastSurpriseEndSecond = elapsedSeconds;

        const btn = $('actionBtn');
        btn.textContent = "ABANDONNER";
        btn.className = "stop";
      } else if (presenceMode === 'final') {
        clearTimeout(presenceTimer);
        presenceMode = null;

        const stats = chargerDonneesStats();
        const today = recupererDateJour();
        const targetTier = selectedTierId ? DURATION_TIERS.find(t => t.id === selectedTierId) : DURATION_TIERS[0];
        const canValidateTier = targetTier && configuredMaxSeconds >= targetTier.minSec;
        const alreadyDoneToday = canValidateTier && stats.tiers[targetTier.id]?.lastDate === today;

        if (canValidateTier && !alreadyDoneToday) {
          // Offrir le choix : Streak OU Solde (taux divisé par 2)
          pendingVictory = {
            maxSecSession: configuredMaxSeconds,
            dureeReelle: targetSeconds,
            targetTier: targetTier
          };

          const rateHalf = (targetTier.rate / 2);
          const gainPotentiel = Math.floor(targetSeconds * rateHalf);

          $('btnChooseStreak').textContent = `VALIDER SÉRIE ${targetTier.label}`;
          $('btnChooseBank').textContent = `SOLDE TEMPS : +${formaterTemps(gainPotentiel)} (×${rateHalf.toFixed(3).replace(/\.?0+$/, '')})`;

          $('actionBtn').style.display = 'none';
          $('rewardChoiceSection').style.display = 'flex';
          toggleFormInputs(true);
        } else {
          // Si palier déjà validé aujourd'hui ou pas de palier cible : encaissement direct au taux plein
          pendingVictory = {
            maxSecSession: configuredMaxSeconds,
            dureeReelle: targetSeconds,
            targetTier: targetTier
          };
          traiterRecompenseSession('bank_full');
        }
      } else if (running) {
        declarerEchec("ABANDON");
      } else {
        demarrerSession();
      }
    }

    function demarrerSession() {
      sauvegarderParametres();

      const minTotal = lireSecondesConfig('minH', 'minM', 'minS');
      const maxTotal = lireSecondesConfig('maxH', 'maxM', 'maxS');
      const distMode = $('probDist').value;

      if (maxTotal <= 0) return alert("La durée maximum doit être supérieure à 0.");
      if (distMode !== 'fixed' && minTotal > maxTotal) return alert("Le minimum ne peut pas dépasser le maximum.");

      configuredMaxSeconds = maxTotal;
      targetSeconds = calculerTempsCible(minTotal, maxTotal, distMode);
      surpriseProbPerSec = (distMode === 'fixed') ? (parseFloat($('surpriseFreq').value) || 0) : 0;
      
      elapsedSeconds = 0;
      pauseOffsetMs = 0;
      startTime = Date.now();
      lastSurpriseEndSecond = -999;
      presenceMode = null;
      pendingVictory = null;
      running = true;

      $('rewardChoiceSection').style.display = 'none';
      $('actionBtn').style.display = 'block';

      toggleFormInputs(true);
      toggleChronoDisplay();

      const btn = $('actionBtn');
      btn.textContent = "ABANDONNER";
      btn.className = "stop";
      $('stopwatch').textContent = formaterChrono(0);

      clearInterval(masterInterval);
      masterInterval = setInterval(moteurTemps, 200);
    }

    function moteurTemps() {
      if (!running || presenceMode !== null) return;

      const currentSec = Math.floor((Date.now() - startTime - pauseOffsetMs) / 1000);
      if (currentSec <= elapsedSeconds) return;

      elapsedSeconds = currentSec;
      $('stopwatch').textContent = formaterChrono(elapsedSeconds);

      if (elapsedSeconds >= targetSeconds) {
        clearInterval(masterInterval);
        running = false;
        activerCompteARebours('final', 10, "!", "NON VALIDÉ");
        return;
      }

      if (surpriseProbPerSec > 0) {
        const delaiEcoule = (elapsedSeconds - lastSurpriseEndSecond) >= 10;
        const pasTropProcheFin = (targetSeconds - elapsedSeconds) > 20;

        if (delaiEcoule && pasTropProcheFin && Math.random() < surpriseProbPerSec) {
          pauseStartMs = Date.now();
          activerCompteARebours('mid', 10, "?", "CONTRÔLE MANQUÉ");
        }
      }
    }

    function activerCompteARebours(mode, seconds, symbol, failReason) {
      clearTimeout(presenceTimer);
      presenceMode = mode;
      const btn = $('actionBtn');
      btn.textContent = symbol;
      btn.className = "presence";
      presenceTimer = setTimeout(() => {
        if (presenceMode === mode) declarerEchec(failReason);
      }, seconds * 1000);
    }

    function declarerEchec(raison = "NON VALIDÉ") {
      presenceMode = null;
      running = false;
      pendingVictory = null;
      clearInterval(masterInterval);
      clearTimeout(presenceTimer);

      $('rewardChoiceSection').style.display = 'none';
      $('actionBtn').style.display = 'block';

      const tempsTenu = formaterTemps(elapsedSeconds);
      reinitialiserBouton(`PERDU (${tempsTenu})\n${raison}\nRECOMMENCER`);
    }

    function reinitialiserBouton(label = "COMMENCER") {
      toggleFormInputs(false);
      const btn = $('actionBtn');
      btn.textContent = label;
      btn.className = "";
    }

    // Écouteurs d'événements
    $('btnExport').addEventListener('click', exporterSauvegarde);
    $('btnImport').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', importerSauvegarde);
    $('actionBtn').addEventListener('click', handleClick);
    $('btnBuyStreak').addEventListener('click', acheterStreak);

    $('btnChooseStreak').addEventListener('click', () => traiterRecompenseSession('streak'));
    $('btnChooseBank').addEventListener('click', () => traiterRecompenseSession('bank_half'));

    ['minH', 'minM', 'minS'].forEach(id => $(id).addEventListener('input', sauvegarderParametres));
    ['maxH', 'maxM', 'maxS'].forEach(id => $(id).addEventListener('input', actualiserPalierSelonMax));

    $('surpriseFreq').addEventListener('change', sauvegarderParametres);
    $('probDist').addEventListener('change', () => {
      gererChangementDistribution();
      sauvegarderParametres();
    });
    $('showStopwatch').addEventListener('change', () => {
      toggleChronoDisplay();
      sauvegarderParametres();
    });

    // Initialisation
    chargerParametres();
    gererChangementDistribution();
    toggleChronoDisplay();
    actualiserPalierSelonMax();
  </script>
</body>
</html>
