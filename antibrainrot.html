<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>ANTI BRAINROTTING</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 10px 14px;
    }
    .card, .backup-actions, button#actionBtn, #buySection, #bonusInfo {
      width: 100%;
      max-width: 360px;
    }
    .backup-actions {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }
    .btn-secondary {
      flex: 1;
      background: #000;
      border: 1px solid #fff;
      color: #fff;
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
      appearance: none;
    }
    .btn-secondary:hover {
      background: #fff;
      color: #000;
    }
    .unified-stats-card, .config-card {
      background: #000;
      border: 1px solid #fff;
      border-radius: 8px;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .unified-stats-card { padding: 8px 10px; }
    .config-card { padding: 8px 12px; }

    .stats-header {
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-bottom: 1px solid #222;
      padding-bottom: 6px;
    }
    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1px;
      font-weight: 600;
    }
    .stat-val {
      font-size: 1.05rem;
      font-weight: 700;
      font-family: "SF Mono", Monaco, Consolas, monospace;
    }
    .stat-sub { font-size: 0.68rem; margin-top: 1px; }

    .tiers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
      gap: 4px;
    }
    .tier-box {
      background: #000;
      border: 1px solid #fff;
      border-radius: 6px;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.2s, border-color 0.2s, transform 0.1s;
      cursor: pointer;
    }
    .tier-box:active { transform: scale(0.97); }

    .tier-box.locked {
      border-color: #444;
      color: #666;
      opacity: 0.55;
    }
    .tier-box.locked span { color: #666; }

    .tier-box.completed-today {
      border: 1px solid #fff;
      color: #fff;
      opacity: 1;
    }
    .tier-box.completed-today span {
      color: #fff;
      font-weight: normal;
    }


    .tier-box.selected-target {
      border: 2px solid #fff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
      opacity: 1 !important;
      color: #fff !important;
    }
    .tier-box.selected-target span {
      color: #fff !important;
      font-weight: 900 !important;
    }

    .tier-label { font-size: 0.64rem; font-weight: 700; margin-bottom: 1px; }
    .tier-val {
      font-size: 0.78rem;
      font-weight: 700;
      font-family: "SF Mono", Monaco, Consolas, monospace;
    }
    .tier-rec { font-size: 0.58rem; margin-top: 1px; }
    .tier-mult {
      font-size: 0.55rem;
      font-family: "SF Mono", Monaco, Consolas, monospace;
      color: #aaa;
      margin-top: 1px;
    }

    #bonusInfo {
      display: none;
      background: #000;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #bbb;
      line-height: 1.4;
    }
    #bonusInfo .highlight {
      color: #fff;
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-weight: 700;
    }

    #buySection {
      margin-bottom: 6px;
      display: none;
    }
    #btnBuyStreak {
      width: 100%;
      background: #000;
      color: #fff;
      border: 1px dashed #fff;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    #btnBuyStreak:hover:not(:disabled) {
      background: #fff;
      color: #000;
    }
    #btnBuyStreak:disabled {
      border-color: #444;
      color: #555;
      cursor: not-allowed;
    }

    .config-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .row-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .inputs-wrapper { display: flex; align-items: center; gap: 4px; }
    .unit-tag { font-size: 0.72rem; margin-right: 3px; font-weight: 600; }

    input[type="number"], select {
      background: #000;
      border: 1px solid #fff;
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      appearance: none;
    }
    input[type="number"] {
      padding: 4px 2px;
      width: 48px;
      text-align: center;
      font-weight: bold;
    }
    select { padding: 4px 6px; max-width: 185px; font-weight: 600; }
    input:disabled, select:disabled { border: 1px solid #fff; -webkit-text-fill-color: #fff; }

    .checkbox-label {
      display: flex;
      align-items: center;
      cursor: pointer;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .checkbox-label input { width: 15px; height: 15px; accent-color: #fff; cursor: pointer; }

    button#actionBtn {
      background: #fff;
      color: #000;
      border: 1px solid #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      min-height: 44px;
      line-height: 1.3;
      white-space: pre-line;
      margin-bottom: 6px;
      transition: transform 0.1s ease;
      touch-action: manipulation;
      appearance: none;
    }
    button#actionBtn:active { transform: scale(0.98); }
    button#actionBtn.stop {
      background: #000;
      color: #fff;
    }
    button#actionBtn.stop:active {
      background: #fff;
      color: #000;
    }
    button#actionBtn.presence {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
    }

    #stopwatch {
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-size: 1.15rem;
      letter-spacing: 2px;
      min-height: 22px;
      font-weight: 700;
    }
    #stopwatch.hidden, #importFile { display: none; }
  </style>
</head>
<body>

  <div class="backup-actions">
    <button class="btn-secondary" id="btnExport">Exporter</button>
    <button class="btn-secondary" id="btnImport">Importer</button>
    <input type="file" id="importFile" accept=".json">
  </div>

  <div class="unified-stats-card card">
    <div class="stats-header">
      <div class="stat-box">
        <span class="stat-label">Série Quotidienne</span>
        <span class="stat-val" id="statDayStreak">0 j</span>
        <span class="stat-sub" id="statDayStreakRecord">Record : 0 j</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Solde Temps</span>
        <span class="stat-val" id="statBank">0s</span>
        <span class="stat-sub">Réserve de streak</span>
      </div>
    </div>
    <div class="tiers-grid" id="tiersContainer"></div>
  </div>

  <div id="bonusInfo"></div>

  <div id="buySection">
    <button id="btnBuyStreak">Acheter le streak</button>
  </div>

  <div class="config-card card">
    <div class="config-row" id="rowMin">
      <span class="row-label">Min</span>
      <div class="inputs-wrapper">
        <input type="number" id="minM" value="0" min="0" max="999">
        <span class="unit-tag">m</span>
        <input type="number" id="minS" value="5" min="0" max="59">
        <span class="unit-tag">s</span>
      </div>
    </div>
    <div class="config-row">
      <span class="row-label">Max</span>
      <div class="inputs-wrapper">
        <input type="number" id="maxM" value="3" min="0" max="999">
        <span class="unit-tag">m</span>
        <input type="number" id="maxS" value="3" min="0" max="59">
        <span class="unit-tag">s</span>
      </div>
    </div>
    <div class="config-row">
      <span class="row-label">Tirage</span>
      <select id="probDist">
        <option value="fixed">Durée fixe (Max)</option>
        <option value="linear" selected>Linéaire (vers max)</option>
        <option value="uniform">Uniforme (classique)</option>
      </select>
    </div>
    <div class="config-row" id="rowSurprise">
      <span class="row-label">Contrôles</span>
      <select id="surpriseFreq">
        <option value="0">Aucun (0 %)</option>
        <option value="0.0055">Rare (~1 / 3 min)</option>
        <option value="0.011" selected>Modéré (~1 / 90 s)</option>
        <option value="0.020">Fréquent (~1 / 50 s)</option>
        <option value="0.0333">Intense (~1 / 30 s)</option>
      </select>
    </div>
    <div class="config-row">
      <span class="row-label">Chrono</span>
      <label class="checkbox-label">
        <input type="checkbox" id="showStopwatch" checked>
        <span>Afficher le temps</span>
      </label>
    </div>
  </div>

  <button id="actionBtn">COMMENCER</button>
  <div id="stopwatch">00:00</div>

  <script>
    const $ = id => document.getElementById(id);

    const DURATION_TIERS = [
      { id: "1m", label: "≥ 1m", minSec: 60, rate: 0.25 },
      { id: "5m", label: "≥ 5m", minSec: 300, rate: 0.30 },
      { id: "10m", label: "≥ 10m", minSec: 600, rate: 0.35 },
      { id: "15m", label: "≥ 15m", minSec: 900, rate: 0.40 },
      { id: "30m", label: "≥ 30m", minSec: 1800, rate: 0.45 },
      { id: "45m", label: "≥ 45m", minSec: 2700, rate: 0.50 },
      { id: "60m", label: "≥ 60m", minSec: 3600, rate: 0.55 },
      { id: "90m", label: "≥ 90m", minSec: 5400, rate: 0.60 },
      { id: "120m", label: "≥ 120m", minSec: 7200, rate: 0.65 },
      { id: "180m", label: "≥ 180m", minSec: 10800, rate: 0.75 }
    ];

    let selectedTierId = null;

    let running = false;
    let presenceMode = null;
    let countdownVal = 0;
    let targetSeconds = 0;
    let configuredMaxSeconds = 0;
    let elapsedSeconds = 0;
    let pauseOffsetMs = 0;
    let pauseStartMs = 0;
    let startTime = 0;
    let masterInterval = null;
    let presenceTimer = null;

    let surpriseProbPerSec = 0;
    let lastSurpriseEndSecond = -999;

    const stopIfRunning = () => { if (running) declarerEchec("APPLICATION QUITTÉE"); };
    document.addEventListener("visibilitychange", () => { if (document.hidden) stopIfRunning(); });
    window.addEventListener("pagehide", stopIfRunning);
    window.addEventListener("blur", stopIfRunning);

    const recupererDateJour = () => new Date().toISOString().slice(0, 10);

    function calculerEcartJours(d1, d2) {
      if (!d1 || !d2) return 999;
      return Math.round((new Date(d2) - new Date(d1)) / 864e5);
    }

    function chargerDonneesStats() {
      const defaut = { lastActiveDate: null, dayStreak: 0, dayStreakRecord: 0, bankSeconds: 0, tiers: {} };
      DURATION_TIERS.forEach(t => defaut.tiers[t.id] = { streak: 0, record: 0, lastDate: null });

      try {
        const raw = localStorage.getItem('meditation_presence_stats');
        if (!raw) return defaut;
        const data = Object.assign(defaut, JSON.parse(raw));
        const today = recupererDateJour();

        if (calculerEcartJours(data.lastActiveDate, today) > 1) data.dayStreak = 0;
        data.dayStreakRecord = Math.max(data.dayStreak, data.dayStreakRecord || 0);

        DURATION_TIERS.forEach(t => {
          const tier = data.tiers[t.id] = data.tiers[t.id] || { streak: 0, record: 0, lastDate: null };
          if (calculerEcartJours(tier.lastDate, today) > 1) tier.streak = 0;
          tier.record = Math.max(tier.streak, tier.record || 0);
        });
        return data;
      } catch {
        return defaut;
      }
    }

    function enregistrerDonneesStats(data) {
      try { localStorage.setItem('meditation_presence_stats', JSON.stringify(data)); } catch {}
    }

    function selectionnerPalier(id) {
      if (running) return;

      if (selectedTierId === id) {
        selectedTierId = null;
      } else {
        selectedTierId = id;
        const t = DURATION_TIERS.find(tier => tier.id === id);
        if (t) {
          $('maxM').value = Math.floor(t.minSec / 60);
          $('maxS').value = t.minSec % 60;
          sauvegarderParametres();
        }
      }
      rafraichirAffichageStats();
    }

    function actualiserPalierSelonMax() {
      const maxSec = (parseInt($('maxM').value, 10) || 0) * 60 + (parseInt($('maxS').value, 10) || 0);
      let palierCorrespondant = null;

      for (let i = DURATION_TIERS.length - 1; i >= 0; i--) {
        if (maxSec >= DURATION_TIERS[i].minSec) {
          palierCorrespondant = DURATION_TIERS[i].id;
          break;
        }
      }

      selectedTierId = palierCorrespondant;
      sauvegarderParametres();
      rafraichirAffichageStats();
    }

    function rafraichirAffichageStats() {
      const data = chargerDonneesStats();
      const today = recupererDateJour();

      $('statDayStreak').textContent = `${data.dayStreak} j`;
      $('statDayStreakRecord').textContent = `Record : ${data.dayStreakRecord || 0} j`;
      $('statBank').textContent = formaterTempsCourt(data.bankSeconds || 0);

      const fragment = document.createDocumentFragment();

      DURATION_TIERS.forEach(t => {
        const tData = data.tiers[t.id] || { streak: 0, record: 0, lastDate: null };
        const isDoneToday = tData.lastDate === today;
        const isSelected = selectedTierId === t.id;

        let statusClass = isDoneToday ? "completed-today" : "locked";
        if (isSelected) statusClass += " selected-target";

        const box = document.createElement('div');
        box.className = `tier-box ${statusClass}`;
        box.onclick = () => selectionnerPalier(t.id);
        box.innerHTML = `
          <span class="tier-label">${t.label}</span>
          <span class="tier-val">${tData.streak}j</span>
          <span class="tier-rec">r:${tData.record}</span>
          <span class="tier-mult">×${t.rate}</span>
        `;
        fragment.appendChild(box);
      });

      const container = $('tiersContainer');
      container.replaceChildren(fragment);

      const buySec = $('buySection');
      const buyBtn = $('btnBuyStreak');
      const bonusInfo = $('bonusInfo');
      const tierData = selectedTierId ? data.tiers[selectedTierId] : null;
      const isSelectedDoneToday = tierData ? tierData.lastDate === today : false;

      // Affichage du ratio bonus si le palier sélectionné est déjà fait aujourd'hui
      if (selectedTierId && !running && isSelectedDoneToday) {
        const tierObj = DURATION_TIERS.find(t => t.id === selectedTierId);
        const secParMin = Math.round(60 * tierObj.rate);
        bonusInfo.style.display = 'block';
        bonusInfo.innerHTML = `Palier <span class="highlight">${tierObj.label}</span> déjà validé : bonus réserve actif à <span class="highlight">×${tierObj.rate}</span> (1m tenue = ${secParMin}s épargnées)`;
      } else {
        bonusInfo.style.display = 'none';
      }

      // Bouton d'achat visible uniquement si le palier n'est pas encore fait aujourd'hui
      if (selectedTierId && !running && !isSelectedDoneToday) {
        const tierObj = DURATION_TIERS.find(t => t.id === selectedTierId);
        const costSec = Math.round(tierObj.minSec * 1.5);
        buySec.style.display = 'block';
        buyBtn.textContent = `Acheter streak ${tierObj.label} (${formaterTempsCourt(costSec)})`;
        buyBtn.disabled = (data.bankSeconds || 0) < costSec;
      } else {
        buySec.style.display = 'none';
      }
    }

    function acheterStreak() {
      if (!selectedTierId || running) return;
      const data = chargerDonneesStats();
      const today = recupererDateJour();
      const tierObj = DURATION_TIERS.find(t => t.id === selectedTierId);
      if (!tierObj) return;

      const costSec = Math.round(tierObj.minSec * 1.5);
      if ((data.bankSeconds || 0) < costSec) {
        alert("Solde de temps insuffisant pour acheter ce streak.");
        return;
      }

      data.bankSeconds -= costSec;

      if (data.lastActiveDate !== today) {
        data.dayStreak = (calculerEcartJours(data.lastActiveDate, today) === 1) ? data.dayStreak + 1 : 1;
        data.lastActiveDate = today;
      }
      data.dayStreakRecord = Math.max(data.dayStreak, data.dayStreakRecord || 0);

      const tier = data.tiers[tierObj.id] = data.tiers[tierObj.id] || { streak: 0, record: 0, lastDate: null };
      tier.streak = (calculerEcartJours(tier.lastDate, today) === 1) ? tier.streak + 1 : 1;
      tier.lastDate = today;
      tier.record = Math.max(tier.streak, tier.record || 0);

      enregistrerDonneesStats(data);
      rafraichirAffichageStats();
      alert(`Streak ${tierObj.label} acheté avec succès !`);
    }

    function exporterSauvegarde() {
      const exportData = {
        version: 5,
        dateExport: new Date().toISOString(),
        config: localStorage.getItem('meditation_presence_config'),
        stats: localStorage.getItem('meditation_presence_stats')
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `presence-backup-${recupererDateJour()}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importerSauvegarde(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.stats) {
            JSON.parse(data.stats);
            localStorage.setItem('meditation_presence_stats', data.stats);
          }
          if (data.config) {
            JSON.parse(data.config);
            localStorage.setItem('meditation_presence_config', data.config);
          }
          chargerParametres();
          gererChangementDistribution();
          toggleChronoDisplay();
          actualiserPalierSelonMax();
          alert("Données importées avec succès.");
        } catch {
          alert("Erreur lors de l'import : fichier corrompu ou invalide.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function comptabiliserSession(estVictoire, maxSecSession, dureeReelle) {
      const stats = chargerDonneesStats();
      const today = recupererDateJour();
      let estComptabilise = false;
      let gainBanque = 0;
      let tauxApplique = 0.25;

      if (estVictoire) {
        if (stats.lastActiveDate !== today) {
          stats.dayStreak = (calculerEcartJours(stats.lastActiveDate, today) === 1) ? stats.dayStreak + 1 : 1;
          stats.lastActiveDate = today;
        }
        stats.dayStreakRecord = Math.max(stats.dayStreak, stats.dayStreakRecord || 0);

        if (selectedTierId) {
          const t = DURATION_TIERS.find(tier => tier.id === selectedTierId);
          if (t && maxSecSession >= t.minSec) {
            const tier = stats.tiers[t.id] = stats.tiers[t.id] || { streak: 0, record: 0, lastDate: null };
            if (tier.lastDate !== today) {
              tier.streak = (calculerEcartJours(tier.lastDate, today) === 1) ? tier.streak + 1 : 1;
              tier.lastDate = today;
              tier.record = Math.max(tier.streak, tier.record || 0);
              estComptabilise = true;
            }
          }
        } else {
          for (let i = 0; i < DURATION_TIERS.length; i++) {
            const t = DURATION_TIERS[i];
            const tier = stats.tiers[t.id] = stats.tiers[t.id] || { streak: 0, record: 0, lastDate: null };
            if (tier.lastDate === today) continue;

            if (maxSecSession >= t.minSec) {
              tier.streak = (calculerEcartJours(tier.lastDate, today) === 1) ? tier.streak + 1 : 1;
              tier.lastDate = today;
              tier.record = Math.max(tier.streak, tier.record || 0);
              estComptabilise = true;
            }
            break;
          }
        }

        if (!estComptabilise) {
          const t = DURATION_TIERS.find(tier => tier.id === selectedTierId);
          tauxApplique = t ? t.rate : 0.25;
          gainBanque = Math.floor(dureeReelle * tauxApplique);
          stats.bankSeconds = (stats.bankSeconds || 0) + gainBanque;
        }
      }

      enregistrerDonneesStats(stats);
      rafraichirAffichageStats();
      return { estComptabilise, gainBanque, tauxApplique };
    }

    function sauvegarderParametres() {
      try {
        localStorage.setItem('meditation_presence_config', JSON.stringify({
          minM: $('minM').value, minS: $('minS').value,
          maxM: $('maxM').value, maxS: $('maxS').value,
          surpriseFreq: $('surpriseFreq').value,
          probDist: $('probDist').value,
          showStopwatch: $('showStopwatch').checked
        }));
      } catch {}
    }

    function chargerParametres() {
      try {
        const config = JSON.parse(localStorage.getItem('meditation_presence_config') || '{}');
        ['minM', 'minS', 'maxM', 'maxS', 'surpriseFreq', 'probDist'].forEach(k => {
          if (config[k] !== undefined && $(k)) $(k).value = config[k];
        });
        if (config.showStopwatch !== undefined) $('showStopwatch').checked = config.showStopwatch;
      } catch {}
    }

    function gererChangementDistribution() {
      const isFixed = $('probDist').value === 'fixed';
      $('minM').disabled = $('minS').disabled = isFixed;
      $('rowMin').style.display = isFixed ? "none" : "flex";

      $('surpriseFreq').disabled = !isFixed;
      $('rowSurprise').style.display = isFixed ? "flex" : "none";
    }

    function toggleChronoDisplay() {
      $('stopwatch').classList.toggle('hidden', !$('showStopwatch').checked);
    }

    function formaterTemps(totalSec) {
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return (m > 0 && s > 0) ? `${m}m ${s}s` : (m > 0 ? `${m}m` : `${s}s`);
    }

    function formaterTempsCourt(totalSec) {
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      if (m > 0 && s > 0) return `${m}m${s}s`;
      if (m > 0) return `${m}m`;
      return `${s}s`;
    }

    function formaterChrono(sec) {
      return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
    }

    function calculerTempsCible(minSec, maxSec, mode) {
      if (mode === 'fixed' || minSec >= maxSec) return maxSec;
      const u = Math.random();
      const factors = {
        linear: Math.sqrt(u),
        uniform: u
      };
      return minSec + Math.floor((factors[mode] ?? u) * (maxSec - minSec + 1));
    }

    function toggleFormInputs(disabled) {
      ['maxM', 'maxS', 'showStopwatch', 'probDist'].forEach(id => $(id).disabled = disabled);
      if (disabled) {
        $('minM').disabled = $('minS').disabled = true;
        $('surpriseFreq').disabled = true;
        $('buySection').style.display = 'none';
        $('bonusInfo').style.display = 'none';
      } else {
        gererChangementDistribution();
        rafraichirAffichageStats();
      }
    }

    function handleClick() {
      if (presenceMode === 'mid') {
        clearTimeout(presenceTimer);
        presenceMode = null;
        pauseOffsetMs += (Date.now() - pauseStartMs);
        lastSurpriseEndSecond = elapsedSeconds;

        const btn = $('actionBtn');
        btn.textContent = "ABANDONNER";
        btn.className = "stop";
      } else if (presenceMode === 'final') {
        clearTimeout(presenceTimer);
        presenceMode = null;

        const res = comptabiliserSession(true, configuredMaxSeconds, targetSeconds);
        const statut = res.estComptabilise 
          ? "COMPTABILISÉ" 
          : (res.gainBanque > 0 ? `+${formaterTemps(res.gainBanque)} (×${res.tauxApplique})` : "NON COMPTABILISÉ");
        const tempsFormate = formaterTemps(targetSeconds);

        reinitialiserBouton(`GAGNÉ - ${statut} (${tempsFormate})\nRECOMMENCER`);
      } else if (running) {
        declarerEchec("ABANDON");
      } else {
        demarrerSession();
      }
    }

    function demarrerSession() {
      sauvegarderParametres();

      const minTotal = (parseInt($('minM').value, 10) || 0) * 60 + (parseInt($('minS').value, 10) || 0);
      const maxTotal = (parseInt($('maxM').value, 10) || 0) * 60 + (parseInt($('maxS').value, 10) || 0);
      const distMode = $('probDist').value;

      if (maxTotal <= 0) return alert("La durée maximum doit être supérieure à 0.");
      if (distMode !== 'fixed' && minTotal > maxTotal) return alert("Le minimum ne peut pas dépasser le maximum.");

      configuredMaxSeconds = maxTotal;
      targetSeconds = calculerTempsCible(minTotal, maxTotal, distMode);
      
      surpriseProbPerSec = (distMode === 'fixed') ? (parseFloat($('surpriseFreq').value) || 0) : 0;
      
      elapsedSeconds = 0;
      pauseOffsetMs = 0;
      startTime = Date.now();
      lastSurpriseEndSecond = -999;
      presenceMode = null;
      running = true;

      toggleFormInputs(true);
      toggleChronoDisplay();

      const btn = $('actionBtn');
      btn.textContent = "ABANDONNER";
      btn.className = "stop";
      $('stopwatch').textContent = "00:00";

      clearInterval(masterInterval);
      masterInterval = setInterval(moteurTemps, 200);
    }

    function moteurTemps() {
      if (!running || presenceMode !== null) return;

      const currentSec = Math.floor((Date.now() - startTime - pauseOffsetMs) / 1000);
      if (currentSec <= elapsedSeconds) return;

      elapsedSeconds = currentSec;
      $('stopwatch').textContent = formaterChrono(elapsedSeconds);

      if (elapsedSeconds >= targetSeconds) {
        clearInterval(masterInterval);
        running = false;
        activerCompteARebours('final', 10, "TERMINER", "NON VALIDÉ");
        return;
      }

      if (surpriseProbPerSec > 0) {
        const delaiEcoule = (elapsedSeconds - lastSurpriseEndSecond) >= 10;
        const pasTropProcheFin = (targetSeconds - elapsedSeconds) > 20;

        if (delaiEcoule && pasTropProcheFin && Math.random() < surpriseProbPerSec) {
          pauseStartMs = Date.now();
          activerCompteARebours('mid', 10, "PRÉSENT", "CONTRÔLE MANQUÉ");
        }
      }
    }

    function activerCompteARebours(mode, seconds, labelPrefix, failReason) {
      clearTimeout(presenceTimer);
      presenceMode = mode;
      countdownVal = seconds;

      const step = () => {
        if (presenceMode !== mode) return;
        const btn = $('actionBtn');
        if (countdownVal > 0) {
          btn.textContent = `${labelPrefix} (${countdownVal}s)`;
          btn.className = "presence";
          countdownVal--;
          presenceTimer = setTimeout(step, 1000);
        } else {
          declarerEchec(failReason);
        }
      };
      step();
    }

    function declarerEchec(raison = "NON VALIDÉ") {
      presenceMode = null;
      running = false;
      clearInterval(masterInterval);
      clearTimeout(presenceTimer);

      const tempsTenu = formaterTemps(elapsedSeconds);
      comptabiliserSession(false, configuredMaxSeconds, 0);
      reinitialiserBouton(`PERDU : ${raison} (${tempsTenu})\nRECOMMENCER`);
    }

    function reinitialiserBouton(label = "COMMENCER") {
      toggleFormInputs(false);
      const btn = $('actionBtn');
      btn.textContent = label;
      btn.className = "";
    }

    // Écouteurs d'événements
    $('btnExport').addEventListener('click', exporterSauvegarde);
    $('btnImport').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', importerSauvegarde);
    $('actionBtn').addEventListener('click', handleClick);
    $('btnBuyStreak').addEventListener('click', acheterStreak);

    $('minM').addEventListener('input', sauvegarderParametres);
    $('minS').addEventListener('input', sauvegarderParametres);

    $('maxM').addEventListener('input', actualiserPalierSelonMax);
    $('maxS').addEventListener('input', actualiserPalierSelonMax);

    $('surpriseFreq').addEventListener('change', sauvegarderParametres);
    $('probDist').addEventListener('change', () => {
      gererChangementDistribution();
      sauvegarderParametres();
    });
    $('showStopwatch').addEventListener('change', () => {
      toggleChronoDisplay();
      sauvegarderParametres();
    });

    // Initialisation
    chargerParametres();
    gererChangementDistribution();
    toggleChronoDisplay();
    actualiserPalierSelonMax();
  </script>
</body>
</html>
