<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>ANTI BRAINROTTING</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Modale d'authentification -->
  <div id="authModal" class="hidden modal-overlay">
    <div class="modal-card">
      <h3 id="modalTitle">Connexion</h3>
      <input type="text" id="modalUsername" placeholder="Nom d'utilisateur" autocomplete="username">
      <input type="password" id="modalPassword" placeholder="Mot de passe" autocomplete="current-password">
      <div class="modal-buttons">
        <button class="btn-secondary" id="btnModalSubmit">Valider</button>
        <button class="btn-secondary" id="btnModalCancel">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Cadre de synchronisation placé tout en haut -->
  <div id="cloudSyncStatus" class="sync-card">
    ● MODE LOCAL (NON CONNECTÉ)
  </div>

  <!-- Bouton Créer un compte -->
  <div class="backup-actions" id="signupSection">
    <button class="btn-secondary" id="btnRegister">Créer un compte</button>
  </div>

  <!-- Barre Connexion / Déconnexion et statut -->
  <div class="backup-actions">
    <button class="btn-secondary" id="btnLogin">Connexion</button>
    <button class="btn-secondary hidden" id="btnLogout">Déconnexion</button>
    <button class="btn-secondary" id="btnUserStatus" disabled>Non connecté</button>
  </div>

  <div class="unified-stats-card card">
    <div class="stats-header">
      <div class="stat-box">
        <span class="stat-label">Série Quotidienne</span>
        <span class="stat-val" id="statDayStreak">0 j</span>
        <span class="stat-sub" id="statDayStreakRecord">Record : 0 j</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Solde Temps</span>
        <span class="stat-val" id="statBank">0s</span>
        <span class="stat-sub">Réserve de streak</span>
      </div>
    </div>
    <div class="tiers-grid" id="tiersContainer"></div>
  </div>

  <div id="bonusInfo"></div>

  <div id="buySection">
    <button id="btnBuyStreak">Acheter le streak</button>
  </div>

  <div class="config-card card">
    <div class="config-row">
      <span class="row-label">Tirage</span>
      <select id="probDist">
        <option value="fixed">Durée fixe (Palier)</option>
        <option value="linear" selected>Linéaire (vers palier)</option>
        <option value="uniform">Uniforme (classique)</option>
      </select>
    </div>
    <div class="config-row" id="rowSurprise">
      <span class="row-label">Contrôles</span>
      <select id="surpriseFreq">
        <option value="0">Aucun (0 %)</option>
        <option value="0.0055">Rare (~1 / 3 min)</option>
        <option value="0.011" selected>Modéré (~1 / 90 s)</option>
        <option value="0.020">Fréquent (~1 / 50 s)</option>
        <option value="0.0333">Intense (~1 / 30 s)</option>
      </select>
    </div>
    <div class="config-row">
      <span class="row-label">Chrono</span>
      <label class="checkbox-label">
        <input type="checkbox" id="showStopwatch" checked>
        <span>Afficher le temps</span>
      </label>
    </div>
  </div>

  <div id="rewardChoiceSection">
    <button class="btn-reward" id="btnChooseStreak">VALIDER LA SÉRIE</button>
    <button class="btn-reward" id="btnChooseBank">SOLDE EN BANQUE</button>
  </div>

  <button id="actionBtn">COMMENCER</button>
  <div id="stopwatch">00:00</div>

  <script src="app.js"></script>
</body>
</html>
