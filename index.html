<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>ANTI BRAINROTTING</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barre d'import / export de sauvegarde JSON -->
  <div class="backup-actions">
    <button class="btn-secondary" id="btnExport">Exporter</button>
    <button class="btn-secondary" id="btnImport">Importer</button>
    <input type="file" id="fileInputImport" accept=".json" class="hidden">
  </div>

  <!-- Statistiques -->
  <div class="unified-stats-card card">
    <div class="stats-header">
      <div class="stat-box">
        <span class="stat-label">Série Quotidienne</span>
        <span class="stat-val" id="statDayStreak">0j</span>
        <span class="stat-sub" id="statDayStreakRecord">Record : 0j</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Solde Temps</span>
        <span class="stat-val" id="statBank">0s</span>
        <span class="stat-sub">Réserve de streak</span>
      </div>
    </div>
    <div class="tiers-grid" id="tiersContainer"></div>
  </div>

  <div id="bonusInfo"></div>

  <div id="buySection">
    <button id="btnBuyStreak">Acheter le streak</button>
  </div>

  <!-- Sélecteur de contrôles surprises (toujours visible) -->
  <div class="mode-select-container" id="rowSurpriseCard">
    <select id="surpriseFreq" class="full-width-select">
      <option value="0.0055">Contrôles : Rares (1 / 3 min)</option>
      <option value="0.011" selected>Contrôles : Modérés (1 / 90 s)</option>
      <option value="0.020">Contrôles : Fréquents (1 / 50 s)</option>
      <option value="0.0333">Contrôles : Intenses (1 / 30 s)</option>
      <option value="0.1">Contrôles : Extrêmes (1 / 10 s)</option>
      <option value="0.05">Contrôles : Impossible (1 / 5 s)</option>
    </select>
  </div>

  <div id="rewardChoiceSection">
    <button class="btn-reward" id="btnChooseStreak">VALIDER LA SÉRIE</button>
    <button class="btn-reward" id="btnChooseBank">SOLDE EN BANQUE</button>
  </div>

  <button id="actionBtn">COMMENCER</button>

  <script src="app.js"></script>
</body>
</html>
